name: Publish Comick Test

on:
  workflow_dispatch:
  push:
    branches:
      - comick-test
    paths:
      - "src/all/comicklive/**"
      - ".github/scripts/publish-li-repo.py"
      - ".github/workflows/publish-comick-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build signed Comick APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > signingkey.jks

      - name: Build Comick release
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew src:all:comicklive:assembleRelease

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: comick-build-files
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/jar/release/*.jar
            **/build/keiyoushi-source-info.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish Mihon repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: comick-build-files
          path: ~/apk-artifacts/comick-build-files

      - name: Checkout source scripts
        uses: actions/checkout@v4
        with:
          ref: comick-test
          path: main
          persist-credentials: false

      - name: Checkout published repository
        uses: actions/checkout@v4
        with:
          repository: lih114/extensions
          token: ${{ secrets.BOT_PAT }}
          ref: repo
          path: repo
          persist-credentials: true

      - name: Publish repository
        env:
          DELETE: "[]"
        shell: bash
        run: |
          cd repo

          pip install protobuf

          python ../main/.github/scripts/publish-li-repo.py "$DELETE"

          git config user.name "lih114"
          git config user.email "lih114@users.noreply.github.com"

          git status
          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Publish Comick Li Test"
            git push

            curl -L "https://purge.jsdelivr.net/gh/lih114/extensions@repo/index.min.json"
            curl -L "https://purge.jsdelivr.net/gh/lih114/extensions@repo/index.json"
            curl -L "https://purge.jsdelivr.net/gh/lih114/extensions@repo/index.pb"
          else
            echo "No changes to publish"
          fi