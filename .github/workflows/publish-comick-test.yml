name: Build Comick Test

on:
  workflow_dispatch:
  push:
    branches:
      - comick-test
    paths:
      - "src/all/comicklive/**"
      - ".github/workflows/publish-comick-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > signingkey.jks

      - name: Build Comick release
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew src:all:comicklive:assembleRelease

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: comick-li-test-apk
          path: src/all/comicklive/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks