name: Publish Comick Test

on:
  workflow_dispatch:
  push:
    branches:
      - comick-test
    paths:
      - "src/all/comicklive/**"
      - ".github/workflows/publish-comick-test.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build signed Comick APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        shell: bash
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > signingkey.jks

      - name: Build Comick release
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew src:all:comicklive:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: individual-apks
          path: "**/build/outputs/apk/release/*.apk"
          if-no-files-found: error
          retention-days: 1

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks

  publish:
    name: Publish Mihon repository
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: individual-apks
          path: ~/apk-artifacts/individual-apks

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Checkout source scripts
        uses: actions/checkout@v4
        with:
          ref: comick-test
          path: main
          persist-credentials: false

      - name: Create repository files
        shell: bash
        run: |
          cd main

          python ./.github/scripts/move-built-apks.py

          INSPECTOR_LINK="$(curl -s \
            https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest \
            | jq -r '.assets[0].browser_download_url')"

          curl -L "$INSPECTOR_LINK" -o Inspector.jar

          java -jar Inspector.jar "repo/apk" "output.json" "tmp"

          python ./.github/scripts/create-repo.py

      - name: Checkout published repository
        uses: actions/checkout@v4
        with:
          repository: lih114/extensions
          token: ${{ secrets.BOT_PAT }}
          ref: repo
          path: published
          persist-credentials: true

      - name: Replace inherited catalog
        shell: bash
        run: |
          cd published

          rm -rf apk icon jar
          rm -f index.json index.min.json index.pb

          mkdir -p apk icon jar

      - name: Merge and publish
        shell: bash
        run: |
          cd published

          python ../main/.github/scripts/merge-repo.py "[]"

          git config user.name "lih114"
          git config user.email "lih114@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "Publish Comick Li Test"
            git push
          else
            echo "No changes to publish"
          fi